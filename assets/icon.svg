<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.55" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="1" stop-color="#ffcb3d"/>
    </linearGradient>
  </defs>

  <!-- sfondo maskable a tutto campo -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- corno da unicorno (triangolo dorato con spirale) -->
  <g transform="translate(256 96)">
    <path d="M0 0 L26 150 L-26 150 Z" fill="url(#gold)" stroke="#e0a106" stroke-width="4" stroke-linejoin="round"/>
    <path d="M-14 60 Q0 52 14 60 M-18 92 Q0 84 18 92 M-22 124 Q0 116 22 124"
          fill="none" stroke="#e0a106" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- stella magica centrale -->
  <g transform="translate(256 300)">
    <path d="M0 -86 L24 -26 L88 -26 L36 14 L56 78 L0 40 L-56 78 L-36 14 L-88 -26 L-24 -26 Z"
          fill="url(#gold)" stroke="#e0a106" stroke-width="5" stroke-linejoin="round"/>
    <text x="0" y="26" text-anchor="middle" font-family="Arial, sans-serif" font-size="78"
          font-weight="bold" fill="#6a3bbf">7</text>
  </g>

  <!-- scintille -->
  <g fill="#ffffff">
    <circle cx="120" cy="150" r="9"/>
    <circle cx="400" cy="200" r="7"/>
    <circle cx="150" cy="380" r="6"/>
    <circle cx="380" cy="410" r="10"/>
    <circle cx="96" cy="280" r="5"/>
    <circle cx="430" cy="320" r="5"/>
  </g>
</svg>
